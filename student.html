<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alumni Connect - Student Portal</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      background: #f7f9fc;
      color: #222;
    }
    header {
      background: #2563eb;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    header h1 { margin: 0; font-size: 22px; }
    nav button {
      background: none;
      border: none;
      color: white;
      margin-left: 20px;
      cursor: pointer;
      font-size: 15px;
    }
    nav button:hover { text-decoration: underline; }

    .page {
      display: none;
      padding: 30px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    /* Home grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .card img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      margin-bottom: 10px;
    }
    .chat-box {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 300px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: none;
    }
    .chat-header {
      background: #2563eb;
      color: white;
      padding: 10px;
      border-radius: 8px 8px 0 0;
    }
    .chat-body {
      height: 200px;
      overflow-y: auto;
      padding: 10px;
      font-size: 14px;
      color: #333;
    }
    .chat-input {
      display: flex;
      border-top: 1px solid #ddd;
    }
    .chat-input input {
      flex: 1;
      border: none;
      padding: 8px;
    }
    .chat-input button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 10px;
      cursor: pointer;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background: #eff6ff;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Alumni Connect</h1>
    <nav id="navbar">
      <button onclick="showPage('home')">Home</button>
      <button onclick="showPage('alumni')">Alumni</button>
      <button onclick="showPage('requests')">My Requests</button>
      <button onclick="showPage('profile')">Profile</button>
      <button onclick="logout()">Logout</button>
    </nav>
  </header>

  <!-- Home Page -->
  <div id="home" class="page" style="display:block;">
    <h2>Find Alumni Guidance</h2>
    <div class="grid" id="alumniGrid"></div>
  </div>

  <!-- Requests -->
  <div id="requests" class="page">
    <h2>My Requests</h2>
    <table>
      <thead>
        <tr><th>Name</th><th>Role</th><th>Domain</th><th>Rating</th></tr>
      </thead>
      <tbody>
        <tr><td>John Doe</td><td>Student</td><td>AI & ML</td><td>⭐⭐⭐</td></tr>
        <tr><td>Kritik P</td><td>Alumni</td><td>Data Analyst</td><td>⭐⭐⭐⭐⭐</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Profile -->
  <div id="profile" class="page">
    <h2>Profile</h2>
    <input type="text" placeholder="Full Name">
    <input type="email" placeholder="Email">
    <input type="text" placeholder="Branch">
    <select>
      <option>Select Domain</option>
      <option>Cybersecurity</option>
      <option>Data Analyst</option>
      <option>AI/ML</option>
    </select>
    <textarea placeholder="Description / Skills"></textarea>
    <button class="primary">Update Profile</button>
  </div>

  <!-- Alumni Directory -->
  <div id="alumni" class="page">
    <h2>Alumni Directory</h2>
    <div class="grid" id="alumniList"></div>
  </div>

  <!-- Chat Box -->
  <div class="chat-box" id="chatBox">
    <div class="chat-header">Chat with Alumni</div>
    <div class="chat-body" id="chatBody">No messages yet</div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="Type a message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const alumniData = [
      { name: "Kritik P", dept: "CSE", year: 2023, domain: "Data Analyst", rating: 5, img: "https://i.pravatar.cc/80?img=1" },
      { name: "Anusha J", dept: "ECE", year: 2022, domain: "Cybersecurity", rating: 4, img: "https://i.pravatar.cc/80?img=2" },
      { name: "John Doe", dept: "CSE", year: 2023, domain: "AI & ML", rating: 3, img: "https://i.pravatar.cc/80?img=3" },
      { name: "Priya S", dept: "EEE", year: 2021, domain: "Data Analyst", rating: 5, img: "https://i.pravatar.cc/80?img=5" }
    ];

    const pages = ["home","alumni","requests","profile"];
    function showPage(id){
      pages.forEach(p => document.getElementById(p).style.display = "none");
      document.getElementById(id).style.display = "block";
    }

    function logout(){ window.location.href = "Final.html"; }

    // Render alumni cards
    const list = document.getElementById("alumniList");
    const grid = document.getElementById("alumniGrid");

    function renderAlumni(data){
      list.innerHTML = "";
      grid.innerHTML = "";
      data.forEach(a=>{
        const html = `
          <div class="card">
            <img src="${a.img}" alt="photo">
            <h3>${a.name}</h3>
            <p>${a.year} Graduate</p>
            <p>${a.dept} • ${a.domain}</p>
            <p>${"⭐".repeat(a.rating)}</p>
            <button onclick="openChat('${a.name}')">Connect</button>
          </div>`;
        list.innerHTML += html;
        grid.innerHTML += html;
      });
    }
    renderAlumni(alumniData);

    function openChat(name){
      document.getElementById("chatBox").style.display = "block";
      document.getElementById("chatBody").innerHTML = `<b>Chat started with ${name}</b>`;
    }

    function sendMessage(){
      const input = document.getElementById("chatInput");
      if(input.value.trim() !== ""){
        document.getElementById("chatBody").innerHTML += `<br>You: ${input.value}`;
        input.value = "";
      }
    }
  </script>

</body>
</html>
