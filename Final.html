<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KLE Technological University Alumni Career Connect</title>
  <style>
    :root{
      --brand:#1e4d91;
      --brand-2:#0c2b57;
      --accent:#ffb703;
      --bg:#f7f8fb;
      --card:#ffffff;
      --text:#1b1f23;
      --muted:#6b7280;
      --radius:14px;
      --ticker-gap:24px;
      --ticker-speed:45s;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      color:var(--text);
      background:var(--bg) url('kle_college.webp') no-repeat center center fixed;
      background-size:cover;
      line-height:1.45;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    header{
      background:linear-gradient(135deg,var(--brand),var(--brand-2));
      color:#fff;
      padding:20px 16px 60px;
    }
    .topbar{
      max-width:1100px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .logo-area{
      display:flex;
      align-items:center;
      gap:16px;
    }
    .logo{
      width:60px;
      height:60px;
      border-radius:10px;
      background:#fff;
      display:block;
      object-fit:contain;
    }
    .site-meta{ display:flex; flex-direction:column; }
    .site-title{ margin:0; font-size:1.25rem; font-weight:700; }
    .site-sub{ margin:2px 0 0; font-size:.9rem; color:#e6eefc; }

    .nav-links{
      display:flex;
      gap:20px;
      align-items:center;
    }
    .nav-links a{
      color:#fff;
      text-decoration:none;
      font-weight:600;
      font-size:1rem;
      transition:opacity 0.2s ease;
    }
    .nav-links a:hover{ opacity:0.8; }

    .admin-link{
      background:rgba(255,183,3,0.2);
      padding:8px 16px;
      border-radius:6px;
      border:1px solid rgba(255,183,3,0.4);
      transition:all 0.3s ease;
    }
    .admin-link:hover{
      background:var(--accent);
      color:var(--brand-2);
      opacity:1;
      border-color:var(--accent);
    }

    .login-section{
      max-width:800px;
      margin:40px auto;
      padding:0 16px;
    }
    .login-container{
      background:rgba(255,255,255,0.95);
      border-radius:var(--radius);
      padding:50px 40px;
      box-shadow:0 10px 40px rgba(0,0,0,.1);
      backdrop-filter:blur(10px);
    }
    .login-title{
      text-align:center;
      font-size:2.5rem;
      margin:0 0 10px;
      color:var(--brand);
      font-weight:700;
    }
    .login-subtitle{
      text-align:center;
      color:var(--muted);
      font-size:1.1rem;
      margin:0 0 30px;
    }

    .role-tabs{
      display:flex;
      margin-bottom:30px;
      border-radius:10px;
      overflow:hidden;
      border:2px solid #e7ebf4;
    }
    .role-tab{
      flex:1;
      padding:18px 30px;
      background:#f7f8fb;
      border:none;
      font-size:1.1rem;
      font-weight:600;
      color:var(--muted);
      cursor:pointer;
      transition:all 0.3s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .role-tab.active{
      background:linear-gradient(135deg,var(--brand),var(--brand-2));
      color:#fff;
      transform:scale(1.02);
    }

    .login-form-content{ display:none; }
    .login-form-content.active{ display:block; }

    .login-form{
      max-width:450px;
      margin:0 auto;
    }
    .form-group{
      margin-bottom:20px;
    }
    .form-group label{
      display:block;
      margin-bottom:8px;
      font-weight:600;
    }
    .form-group input{
      width:100%;
      padding:12px 16px;
      border:2px solid #e7ebf4;
      border-radius:8px;
      font-size:1rem;
    }

    .login-btn{
      width:100%;
      padding:14px;
      background:linear-gradient(135deg,var(--brand),var(--brand-2));
      color:#fff;
      border:none;
      border-radius:8px;
      margin-top:10px;
      cursor:pointer;
    }
    .login-btn:hover{
      background:linear-gradient(135deg,var(--brand-2),var(--brand));
    }

  </style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="logo-area">
      <img class="logo" src="kle.png">
      <div class="site-meta">
        <h1 class="site-title">KLE Alumni Career Connect</h1>
        <p class="site-sub">Connect students with mentors, jobs, and alumni opportunities</p>
      </div>
    </div>
    <nav class="nav-links">
      <a href="#home">Home</a>
      <a href="about.html">About</a>
      <a href="#contact">Contact</a>
      <a href="#login">Sign In</a>
      <a href="admin-login.html" class="admin-link">Admin Login</a>
    </nav>
  </div>
</header>

<main id="home">
  <section class="login-section" id="login">
    <div class="login-container">
      <h2 class="login-title">Welcome Back</h2>
      <p class="login-subtitle">Sign in to access your portal</p>

      <div class="role-tabs">
        <button class="role-tab active" data-role="student" onclick="switchRole('student')">🎓 Student Login</button>
        <button class="role-tab" data-role="alumni" onclick="switchRole('alumni')">👨‍🎓 Alumni Login</button>
      </div>

      <!-- Student Login -->
      <div class="login-form-content active" id="student-form">
        <form class="login-form" onsubmit="handleLogin(event, 'student')">
          <div class="form-group">
            <label for="student-email">Student Email</label>
            <input type="email" id="student-email" required>
          </div>
          <div class="form-group">
            <label for="student-password">Password</label>
            <input type="password" id="student-password" required>
          </div>
          <button type="submit" class="login-btn">Sign In as Student</button>
        </form>
      </div>

      <!-- Alumni Login -->
      <div class="login-form-content" id="alumni-form">
        <form class="login-form" onsubmit="handleLogin(event, 'alumni')">
          <div class="form-group">
            <label for="alumni-email">Alumni Email</label>
            <input type="email" id="alumni-email" required>
          </div>
          <div class="form-group">
            <label for="alumni-password">Password</label>
            <input type="password" id="alumni-password" required>
          </div>
          <button type="submit" class="login-btn">Sign In as Alumni</button>
        </form>
      </div>

    </div>
  </section>
</main>

<script>

function switchRole(role){
  document.querySelectorAll('.role-tab').forEach(tab=>{
    tab.classList.toggle('active', tab.dataset.role === role);
  });

  document.querySelectorAll('.login-form-content').forEach(form=>{
    form.classList.toggle('active', form.id === role+'-form');
  });
}

function handleLogin(event, role){
  event.preventDefault();

  if(role === 'student'){
      const email = document.getElementById("student-email").value.trim();
      const password = document.getElementById("student-password").value.trim();

      // store user temporarily
      localStorage.setItem("logged_student", email);

      // redirect
      window.location.href = "student.html";
  }

  else if(role === "alumni"){
      window.location.href = "alm.html";
  }
}

</script>

</body>
</html>
